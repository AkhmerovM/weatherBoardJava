events {
    worker_connections 1024;
}

http {
    upstream app {
        server app:8080;
    }

    # HTTP → HTTPS редирект (это то, о чём вы спрашивали)
    server {
        listen 80;
        server_name fabrikahimchistki-nk.ru;

        # Специальный путь для обновления сертификатов
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Все остальные запросы перенаправляем на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        server_name fabrikahimchistki-nk.ru;

        # Пути к сертификатам (те, что получили через certbot)
        ssl_certificate /etc/letsencrypt/live/fabrikahimchistki-nk.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fabrikahimchistki-nk.ru/privkey.pem;

        # Современные настройки SSL (рекомендуемые)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Ваш оригинальный location
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}